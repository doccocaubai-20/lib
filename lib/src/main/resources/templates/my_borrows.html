<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/header :: head(pageTitle='Sách đã mượn')}"></head>
<body>
<header th:replace="~{layout/header :: header}"></header>

<h1 class="mb-4">Sách đang mượn</h1>

<div th:if="${myBorrows.isEmpty()}">
    <p class="text-muted">Bạn chưa mượn cuốn sách nào.</p>
</div>

<table class="table table-bordered table-hover" th:unless="${myBorrows.isEmpty()}">
    <thead class="table-light">
        <tr>
            <th>Bìa sách</th>
            <th>Tên sách</th>
            <th>Ngày mượn</th>
            <th>Hạn trả</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="borrow : ${myBorrows}">
            <td style="width: 10%;">
                <img th:src="${borrow.book.image != null ? '/uploads/' + borrow.book.image : '...'}"
                     alt="Cover" class="img-fluid" style="max-height: 80px;">
            </td>
            <td th:text="${borrow.book.title}"></td>
            <td th:text="${#temporals.format(borrow.borrowDate, 'dd-MM-yyyy')}"></td>
            <td th:text="${#temporals.format(borrow.returnDate, 'dd-MM-yyyy')}"></td>
        </tr>
    </tbody>
    <thead><tr><th>...</th><th>Hạn trả</th><th>Trạng thái</th></tr></thead>
    <tbody>
        <tr th:each="borrow : ${myBorrows}">
            <td th:text="${borrow.returnDate != null ? #temporals.format(borrow.returnDate, 'dd-MM-yyyy') : ''}"></td>
            <td><span class="badge"
          th:classappend="${borrow.status == 'PENDING' ? 'bg-warning' : (borrow.status == 'APPROVED' ? 'bg-success' : 'bg-danger')}"
          th:text="${borrow.status}"></span></td>
        </tr>
    </tbody>
</table>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
