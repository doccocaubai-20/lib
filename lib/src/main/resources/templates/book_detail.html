<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6" lang="vi">
<head th:replace="~{layout/header :: head(pageTitle=${book.title})}"></head>
<body>
<header th:replace="~{layout/header :: header}"></header>

<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div class="card shadow-lg border-0 book-detail-card">
    <div class="card-body p-5">
        <div class="row g-5">
            
            <div class="col-md-4 text-center">
                <a href="#" data-bs-toggle="modal" data-bs-target="#imageModal">
                    <img th:src="${book.image != null and not #strings.isEmpty(book.image) ? '/uploads/' + book.image : 'https://via.placeholder.com/300x400.png?text=Book+Cover'}"
                         class="img-fluid rounded shadow-sm book-detail-img" style="cursor: pointer;" alt="Book Cover">
                </a>
            </div>

            <div class="col-md-8">
                <h1 class="display-5 fw-bold" th:text="${book.title}">Tên sách</h1>
                <p class="lead text-muted mb-4">bởi <span th:text="${book.author?.name ?: 'Chưa xác định'}">Tên tác giả</span></p>

                <div class="row mb-3">
                    <div class="col-sm-3"><strong>Thể loại:</strong></div>
                    <div class="col-sm-9"><span class="badge bg-secondary fs-6" th:if="${book.category}" th:text="${book.category.name}"></span></div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-3"><strong>Ngày xuất bản:</strong></div>
                    <div class="col-sm-9"><span th:text="${book.publishDate != null ? #temporals.format(book.publishDate, 'dd-MM-yyyy') : 'Chưa cập nhật'}"></span></div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-3"><strong>Số trang:</strong></div>
                    <div class="col-sm-9"><span th:text="${book.pageCount != null ? book.pageCount : 'Chưa cập nhật'}"></span></div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-3"><strong>Số lượng còn lại:</strong></div>
                    <div class="col-sm-9"><span th:text="${book.quantity}"></span></div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-3"><strong>Ngôn ngữ:</strong></div>
                    <div class="col-sm-9"><span th:text="${book.language != null and not #strings.isEmpty(book.language) ? book.language : 'Chưa cập nhật'}"></span></div>
                </div>
                
                <hr class="my-4">

                <h4>Mô tả</h4>
                <p th:text="${book.description}">Nội dung mô tả chi tiết của cuốn sách...</p>

                <div class="mt-4">
    <a th:href="@{'/books/view/' + ${book.id}}" ... >Đọc sách</a>

    <form th:action="@{'/books/borrow/' + ${book.id}}" method="post" class="d-inline-block"
      sec:authorize="isAuthenticated()">
    <button type="submit" class="btn btn-success btn-lg" th:if="${book.quantity > 0}">
        <i class="bi bi-bag-plus"></i> Gửi yêu cầu mượn
    </button>
    </form>
    
    <div sec:authorize="hasRole('ADMIN')" class="d-inline-block">
        </div>
</div>
            </div>
            
        </div> </div>
</div>

<hr class="my-5 border-secondary">
<div class="row">
    <div class="col-md-7">
        <h3 class="mb-4">Đánh giá từ độc giả</h3>
        <div th:if="${reviews.isEmpty()}"><p class="text-muted">Chưa có đánh giá nào cho cuốn sách này.</p></div>
        <div th:unless="${reviews.isEmpty()}" class="list-group">
            <div th:each="review : ${reviews}" class="list-group-item list-group-item-action flex-column align-items-start mb-3 border-secondary" style="background-color: var(--card-bg-color); color: var(--text-color);">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1" th:if="${review.user}" th:text="${review.user.username}"></h5>
                    <small class="text-muted" th:if="${review.createdAt}" th:text="${#temporals.format(review.createdAt, 'dd-MM-yyyy')}"></small>
                </div>
                <p class="mb-1"><span th:each="i : ${#numbers.sequence(1, 5)}" class="bi" th:classappend="${i <= review.rating} ? 'bi-star-fill text-warning' : 'bi-star'"></span></p>
                <p class="mb-1" th:text="${review.comment}"></p>
            </div>
        </div>
    </div>
    <div class="col-md-5">
        <div sec:authorize="isAuthenticated()">
            <div class="card" style="background-color: var(--card-bg-color); color: var(--text-color);">
                <div class="card-body">
                    <h4 class="card-title">Viết đánh giá của bạn</h4>
                    <form th:action="@{/reviews/add}" th:object="${newReview}" method="post">
                        <input type="hidden" name="bookId" th:value="${book.id}" />
                        <div class="mb-3">
                            <label class="form-label">Xếp hạng</label>
                            <div class="star-rating">
                                <input type="radio" id="5-stars" th:field="*{rating}" value="5" required/><label for="5-stars" class="bi bi-star-fill"></label>
                                <input type="radio" id="4-stars" th:field="*{rating}" value="4" /><label for="4-stars" class="bi bi-star-fill"></label>
                                <input type="radio" id="3-stars" th:field="*{rating}" value="3" /><label for="3-stars" class="bi bi-star-fill"></label>
                                <input type="radio" id="2-stars" th:field="*{rating}" value="2" /><label for="2-stars" class="bi bi-star-fill"></label>
                                <input type="radio" id="1-star"  th:field="*{rating}" value="1" /><label for="1-star" class="bi bi-star-fill"></label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="comment" class="form-label">Bình luận</label>
                            <textarea id="comment" th:field="*{comment}" rows="4" class="form-control" placeholder="Chia sẻ cảm nhận của bạn..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-success">Gửi đánh giá</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="imageModalLabel" th:text="${book.title}"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <img th:src="${book.image != null ? '/uploads/' + book.image : ''}" class="img-fluid">
      </div>
    </div>
  </div>
</div>
    
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
