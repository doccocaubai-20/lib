<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/header :: head(pageTitle='Trang chủ')}"></head>
<body>
<header th:replace="~{layout/header :: header}"></header>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Hồ Sơ Người Dùng</h3>
                </div>

                <div th:if="${user != null}" class="card-body">
                    <div class="mb-3">
                        <label class="form-label"><strong>Tên đăng nhập:</strong></label>
                        <p class="form-control-plaintext" th:text="${user.username}">username</p>
                    </div>

                    <div class="text-center">
                        <a th:href="@{/my-borrows}" class="btn btn-info">Xem sách đã mượn</a>
                    </div>
                </div>

                <div th:if="${user == null}" class="card-body">
                    <p class="text-danger text-center">Không thể tải thông tin người dùng. Vui lòng thử lại.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
