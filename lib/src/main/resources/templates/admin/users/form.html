<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head(pageTitle='Sửa Người dùng')}"></head>
<body>
<header th:replace="~{layout/header :: header}"></header>

<div class.container mt-4>
    <h2>Chỉnh Sửa Người Dùng</h2>
    <form th:action="@{/admin/users/update}" th:object="${user}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label class="form-label">Tên đăng nhập:</label>
            <p class="form-control-plaintext" th:text="*{username}"></p>
        </div>
        <div class="mb-3">
            <label for="fullName" class="form-label">Họ và Tên:</label>
            <input type="text" id="fullName" class="form-control" th:field="*{fullName}">
        </div>
        <div class="mb-3">
            <label class="form-label">Vai trò:</label>
            <div>
                <th:block th:each="role : ${allRoles}">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" th:field="*{roles}" th:value="${role.id}" th:text="${role.name}">
                    </div>
                </th:block>
            </div>
        </div>
        <button type="submit" class="btn btn-success">Lưu thay đổi</button>
        <a th:href="@{/admin/users}" class="btn btn-secondary">Hủy</a>
    </form>
</div>

<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
