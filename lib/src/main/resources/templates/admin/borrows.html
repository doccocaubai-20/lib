<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/header :: head(pageTitle='Trang chủ')}"></head>
<body>
<header th:replace="~{layout/header :: header}"></header>


<div class="container mt-4">
    <h2 class="mb-4">Danh Sách Yêu Cầu Mượn Sách</h2>

    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Người mượn</th>
                        <th>Tên sách</th>
                        <th>Ngày yêu cầu</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="borrow : ${allBorrows}">
                        <td th:text="${borrow.id}">1</td>
                        <td th:text="${borrow.user.fullName != null ? borrow.user.fullName : borrow.user.username}">Tên người dùng</td>
                        <td th:text="${borrow.book.title}">Tên sách</td>
                        <td th:text="${#temporals.format(borrow.borrowDate, 'dd-MM-yyyy HH:mm')}">Ngày</td>
                        <td>
                            <span th:text="${borrow.status}"
                                  th:classappend="${borrow.status == 'PENDING'} ? 'badge bg-warning text-dark' : 
                                                 (${borrow.status == 'APPROVED'} ? 'badge bg-success' : 'badge bg-danger')">
                                Trạng thái
                            </span>
                        </td>
                        <td>
                            <div th:if="${borrow.status == 'PENDING'}">
                                <form th:action="@{/admin/borrows/approve/{id}(id=${borrow.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-success btn-sm">Duyệt</button>
                                </form>
                                <form th:action="@{/admin/borrows/reject/{id}(id=${borrow.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-danger btn-sm">Từ chối</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${allBorrows.isEmpty()}">
                        <td colspan="6" class="text-center">Chưa có yêu cầu mượn sách nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
