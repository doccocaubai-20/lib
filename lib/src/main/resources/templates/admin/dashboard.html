<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/header :: head(pageTitle='Trang chủ')}"></head>
<body>
<header th:replace="~{layout/header :: header}"></header>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <h3 class="mb-3">Quản lý</h3>
                <div class="list-group">
                    <a th:href="@{/admin/authors}" class="list-group-item list-group-item-action">Quản lý Tác giả</a>
                    <a th:href="@{/admin/categories}" class="list-group-item list-group-item-action">Quản lý Thể loại</a>
                    <a th:href="@{/admin/users}" class="list-group-item list-group-item-action">Quản lý Người dùng</a>
                </div>
            </div>

            <div class="col-md-9">
                <h2>Dashboard</h2>
                <hr>
                <p>Chào mừng bạn đến với trang quản trị!</p>

                <div class="row">
                    <div class="col-md-6">
                        <div class="card text-white bg-primary mb-3">
                            <div class="card-header">Tổng số người dùng</div>
                            <div class="card-body text-center">
                                <h5 class="card-title display-4" th:text="${totalUsers}">0</h5>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                         <div class="card text-white bg-success mb-3">
                            <div class="card-header">Tổng số sách</div>
                            <div class="card-body text-center">
                                <h5 class="card-title display-4" th:text="${totalBooks}">0</h5>
                            </div>
                        </div>
                    </div>
                </div>
                </div>
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
