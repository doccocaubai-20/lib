<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/header :: head(pageTitle='Bảng điều khiển Admin')}"></head>
<body>
<header th:replace="~{layout/header :: header}"></header>

<h1 class="mb-4">Bảng điều khiển</h1>

<div class="row">
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-primary shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                            Tổng số Người dùng</div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${totalUsers}">0</div>
                    </div>
                    <div class="col-auto">
                        <i class="bi bi-people-fill fs-2 text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-success shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                            Tổng số Sách</div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${totalBooks}">0</div>
                    </div>
                    <div class="col-auto">
                        <i class="bi bi-book-half fs-2 text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<h3 class="mt-5">Quản lý</h3>
<div class="list-group">
    <a href="#" class="list-group-item list-group-item-action">Quản lý Người dùng</a>
    <a th:href="@{/books}" class="list-group-item list-group-item-action">Quản lý Sách</a>
    <a href="#" class="list-group-item list-group-item-action">Quản lý Tác giả</a>
    <a href="#" class="list-group-item list-group-item-action">Quản lý Thể loại</a>
</div>


<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
